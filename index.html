<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sir Licks-a-Lot</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:,">
    <!-- JSZip for the export buttons -->
    <script src="vendor/jszip.min.js"></script>
</head>
<body>
    <!--
      This file is the SOURCE of the page. Do not overwrite it with a copy of the
      running page (the old "DOWNLOAD PLAYABLE" did that and broke the editor).
      Dialogs, buttons and panels are created by game.js / editor.js at runtime.
    -->
    <div id="gameContainer">
        <!-- editor button (the title screen, HUD and menus are drawn on the canvas: cfg.ui.layout) -->
        <button id="dbg-gear" title="Editor (F2)">⚙</button>

        <!-- Editor panel (filled by game.js, only shown in debug mode) -->
        <div id="uiLayer" class="hidden">
            <div id="stats"></div>
            <div id="buttons"></div>
        </div>

        <!-- Main Game Canvas -->
        <canvas id="gameCanvas" width="960" height="540"></canvas>
    </div>

    <script type="module" src="game.js"></script>
</body>
</html>
